name: Assemble signed Still APK

on:
  push:
    paths:
      - ".apk-parts/**"
      - ".github/workflows/assemble-apk.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify APK
        shell: bash
        run: |
          if [ ! -d .apk-parts ]; then exit 0; fi
          cat .apk-parts/part-* > Still-0.1.0-android17.apk
          echo "FE5B640A1A24A4543FBF416F823EF1AF6826CF842A4D48F685786934802EE930  Still-0.1.0-android17.apk" | sha256sum --check
          rm -rf .apk-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish signed Still Android 17 APK"
          git push
